# Native Ruff configuration; the policy is in DOCS.md (Static analysis).
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["external", "mutants"]

[lint]
select = ["ALL"]
# Include preview rules by default too; formatter preview remains off.
preview = true
ignore = [
    # Hydra, public ports and SDK overrides expose independent named/positional inputs.
    "PLR0913", "PLR0917", "FBT001", "FBT002", "FBT003",
    # Keep short guard diagnostics at the raise site.
    "EM101", "EM102", "TRY003",
    # Copyright headers are optional. TODO/FIXME notes need no author or issue link.
    "CPY001", "FIX001", "FIX002", "TD001", "TD002", "TD003",
    # Document contracts and constraints. Concise functions and methods can rely on
    # signatures; written sections still have to agree with the implementation.
    "D101", "D102", "D103", "D105", "D107", "D401", "D413", "DOC201", "DOC402", "DOC501",
    # Choose no blank line before class docstrings and first-line multiline summaries.
    # These alternatives conflict with enabled D211 and D212 respectively.
    "D203", "D213",
    # The formatter owns trailing commas.
    "COM812", "COM819",
    # Pydantic/Hydra inspect runtime annotations; keep available cast types unquoted.
    "TC001", "TC002", "TC003", "TC006",
    # Explicit empty-string checks distinguish lexical values from other falsey inputs.
    "PLC1901",
    # Workflow state needs named locals; nested try blocks distinguish lifecycle owners.
    # Branch, return, statement, nesting and McCabe checks still apply.
    "PLR0914", "PLW0717",
    # In-place operators can alter aliasing/array semantics.
    "PLR6104",
    # Small ordered membership literals also accept unhashable inputs.
    "PLR6201",
    # Prefer ordinary generators to starmap for Python and SDK callables.
    "FURB140",
    # Keep code-specific noqa compatible with other tools; RUF100 rejects unused ones.
    "RUF105",
]

[lint.per-file-ignores]
# Test doubles mirror SDK signatures and use local imports to install fakes.
# Assertions inspect private state, exact fixture values, and subprocess outcomes.
"tests/**" = [
    "ANN401", "ARG001", "ARG002", "ARG005", "PLC0415", "PLC2701", "PLR2004",
    "PLR6301", "RUF069", "S101", "S404", "SLF001",
]
# Integration suites use pytest's directory layout.
"tests/integration/**" = ["INP001"]
# These expected paths describe fake records or path-validation inputs.
"tests/test_{clearml_cache,deim_assets,inference,input_correctness,readable_output}.py" = ["S108"]
"tests/integration/fiftyone/test_fiftyone_native_evaluations.py" = ["S108"]
# SDK doubles bypass persistence setters and exercise context-manager entry itself.
"tests/{ddp_cpu_harness,test_ddp_callback_lifecycle,test_native_assets,test_trace_runtime}.py" = ["PLC2801"]
# The fake YOLO result only stores the two fields returned by inference.
"tests/test_inference.py" = ["B903"]
# Expected templates and Git revisions contain literal braces.
"tests/test_config_upload_commands.py" = ["RUF027"]
# The fixture injects a failure specifically after the workload succeeds.
"tests/test_execution_lifecycle.py" = ["RUF075"]
# Workbook fixtures parse XML generated in the test.
"tests/test_shared_extraction_compatibility.py" = ["S405"]
# Command-line tools print results. Only process-launching scripts need PATH-based git/uv.
"scripts/**" = ["T201"]
"scripts/{hygiene,mutation,release,release_lock_guard,verification}.py" = ["S404", "S603"]
"scripts/{hygiene,mutation,release_lock_guard,release_metadata,testmon_environment,verification}.py" = ["S607"]
"scripts/{release_metadata,testmon_environment}.py" = ["S404"]
# Optional psutil and pytest collection are loaded only by the tools that need them.
"scripts/{mutation,verification}.py" = ["PLC0415"]
# Adapters own opaque SDK calls and overrides, platform imports, and subprocesses.
"src/clearml_yolo/adapters/**" = ["ANN401", "PLC0415", "PLR6301", "S404"]
# CLI composition defers SDK imports. Hydra and pipeline boundaries accept composed values.
"src/clearml_yolo/entrypoints/**" = ["PLC0415"]
"src/clearml_yolo/entrypoints/hydra/{common,config_resolution,configs}.py" = ["ANN401"]
"src/clearml_yolo/application/{ports,use_cases/pipeline}.py" = ["ANN401"]
# Native dict mutation bypasses persistent SDK setters.
"src/clearml_yolo/adapters/integrations/native_runtime.py" = ["PLC2801"]
# Hydra exposes sweep/parser functionality through private modules, with regression tests.
"src/clearml_yolo/entrypoints/hydra/{sweeps,validation}.py" = ["PLC2701"]
# FiftyOne discovers register() in this initializer; it is a required plugin entrypoint.
"src/clearml_yolo/adapters/fiftyone/plugin/__init__.py" = ["RUF067"]
# This check verifies an exact integral family size.
"src/clearml_yolo/adapters/clearml/report.py" = ["RUF069"]
# Reads XML members of locally produced XLSX workbooks.
"src/clearml_yolo/adapters/reporting/workbook_identity.py" = ["S405"]
# Rule codes are the project's searchable suppression/review vocabulary.
"ruff.toml" = ["RUF201"]

[lint.pylint]
# Asset receipts and native replay journals verify several independent fields in one guard.
max-bool-expr = 7

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use loguru's logger, which is what every module and the ClearML handler expect."

[lint.isort]
known-first-party = ["clearml_yolo"]

[lint.mccabe]
max-complexity = 10

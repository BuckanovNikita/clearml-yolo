version: '3'

# Deliberately no sources, generates, status, or completion cache: Task freshness never
# establishes completion. Commands run sequentially; only the individual tools reuse
# incremental data. Tools run with `uv run --locked` in this worktree's environment: the
# committed lock resolves the external packages from the ignored external/wheelhouse through
# the ignored repository-root uv.toml (task local-deps prepares both).
vars:
  TEST_WORKERS: '{{default "2" .CY_TEST_WORKERS}}'
  # Command-local environment assignments defeat inherited shared-cache overrides.
  RUN: >-
    env UV_PROJECT_ENVIRONMENT={{.ROOT_DIR | shellQuote}}/.venv
    TESTMON_DATAFILE={{.ROOT_DIR | shellQuote}}/.testmondata
    COVERAGE_FILE={{.ROOT_DIR | shellQuote}}/.tmp/coverage/.coverage
    RUFF_CACHE_DIR={{.ROOT_DIR | shellQuote}}/.ruff_cache
    MYPY_CACHE_DIR={{.ROOT_DIR | shellQuote}}/.mypy_cache
  UV: uv run --locked

  UNIT_SCOPE: --ignore=tests/integration

includes:
  operations:
    taskfile: ./Taskfile.ops.yml
    dir: '{{.ROOT_DIR}}'
    flatten: true

tasks:
  # Individual tools: commands and policy live here and in their native configs.
  staging-check:
    desc: Refuse unstaged tracked or nonignored untracked inputs before prek can stash
    cmds:
      - "{{.RUN}} {{.UV}} python -m scripts.hygiene staging"

  hygiene:
    desc: Tracked file size, conflict, syntax and required-input checks plus safe whitespace fixes
    cmds:
      - >-
        {{.RUN}} {{.UV}} python -m scripts.hygiene check --max-kb 512
        --required Taskfile.yml Taskfile.ops.yml pyproject.toml uv.lock .importlinter
        .pre-commit-config.yaml scripts/git-hook.sh scripts/verification.py

  lock:
    desc: uv lock freshness
    cmds:
      - "{{.RUN}} uv lock --check"

  ruff:
    desc: Ruff lint checks
    cmds:
      - "{{.RUN}} {{.UV}} ruff check ."

  format-check:
    desc: Ruff formatting check
    cmds:
      - "{{.RUN}} {{.UV}} ruff format --check ."

  architecture:
    desc: Declarative product import contracts
    cmds:
      - "{{.RUN}} {{.UV}} lint-imports"

  mypy:
    desc: mypy strict type checks
    cmds:
      - "{{.RUN}} {{.UV}} mypy ."

  vulture:
    desc: Vulture unused-code checks
    cmds:
      - "{{.RUN}} {{.UV}} vulture"

  deptry:
    desc: deptry dependency checks
    cmds:
      - "{{.RUN}} {{.UV}} deptry ."

  fix:
    desc: Apply safe Ruff fixes and formatting before staging
    cmds:
      - "{{.RUN}} {{.UV}} ruff check --fix --no-unsafe-fixes ."
      - "{{.RUN}} {{.UV}} ruff format ."

  # Test modes stay explicit; only affected/full modes compute a fingerprint.
  test:
    desc: pytest affected unit tests with testmon
    vars:
      TESTMON_ENV:
        sh: "{{.RUN}} {{.UV}} python scripts/testmon_environment.py"
    cmds:
      - "{{.RUN}} {{.UV}} pytest --testmon --testmon-env={{.TESTMON_ENV}} {{.UNIT_SCOPE}} -n {{.TEST_WORKERS}}"

  test-full:
    desc: pytest full unit suite and refresh testmon history
    vars:
      TESTMON_ENV:
        sh: "{{.RUN}} {{.UV}} python scripts/testmon_environment.py"
    cmds:
      - "{{.RUN}} {{.UV}} pytest --testmon-noselect --testmon-env={{.TESTMON_ENV}} {{.UNIT_SCOPE}} -n {{.TEST_WORKERS}}"

  coverage:
    desc: pytest full unit suite with coverage.py branch coverage and floor
    cmds:
      - "mkdir -p {{.ROOT_DIR | shellQuote}}/.tmp/coverage"
      - "{{.RUN}} {{.UV}} pytest --cov {{.UNIT_SCOPE}} -n {{.TEST_WORKERS}}"

  mutation:
    desc: mutmut advisory changed-function report through the custom selection driver
    cmds:
      - "{{.RUN}} {{.UV}} python scripts/mutation.py {{.CLI_ARGS}}"

  # Aggregate stages execute sequentially; Task freshness never skips verification.
  check:
    desc: Hygiene and syntax, lock freshness, lint, architecture, types and dependencies
    cmds:
      - task: hygiene
      - task: lock
      - task: ruff
      - task: format-check
      - task: architecture
      - task: mypy
      - task: vulture
      - task: deptry

  verify:
    desc: Change-aware automatic verification (staged, otherwise latest committed inputs)
    vars:
      VERIFY_SCOPE: '{{default "auto" .CY_VERIFY_SCOPE}}'
    cmds:
      - task: check
      - >-
        {{.RUN}} {{.UV}} python -m scripts.verification run
        --scope {{.VERIFY_SCOPE | shellQuote}} --task {{.TASK_EXE | shellQuote}}

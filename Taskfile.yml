version: '3'

# Deliberately no sources, generates, status, or completion cache: Task freshness never
# establishes completion. Commands run sequentially; only the individual tools reuse
# incremental data. Tools run with `uv run --locked` in this worktree's environment: the
# committed lock resolves the external packages from the ignored external/wheelhouse through
# the ignored repository-root uv.toml (task local-deps prepares both).
vars:
  TEST_WORKERS: '{{default "2" .CY_TEST_WORKERS}}'
  # Command-local environment assignments defeat inherited shared-cache overrides.
  RUN: >-
    env UV_PROJECT_ENVIRONMENT={{.ROOT_DIR | shellQuote}}/.venv
    TESTMON_DATAFILE={{.ROOT_DIR | shellQuote}}/.testmondata
    COVERAGE_FILE={{.ROOT_DIR | shellQuote}}/.tmp/coverage/.coverage
    RUFF_CACHE_DIR={{.ROOT_DIR | shellQuote}}/.ruff_cache
    MYPY_CACHE_DIR={{.ROOT_DIR | shellQuote}}/.mypy_cache
  UV: uv run --locked

tasks:
  local-deps:
    desc: >-
      Build the approved external/ checkouts into external/wheelhouse and create uv.toml
      (bootstrap, before any uv run --locked: uvx --from go-task-bin task local-deps)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        set -eu
        missing=""
        for name in digital-metrics report-generator; do
          [ -d "external/$name" ] || missing="$missing external/$name"
        done
        if [ -n "$missing" ]; then
          echo "local-deps: missing approved checkouts:$missing" >&2
          echo "local-deps: check out the approved digital-metrics and report-generator revisions there (docs/development.md, External dependencies)." >&2
          exit 1
        fi
        # Never overwrite an existing uv.toml: it may hold other local settings.
        if [ -e uv.toml ]; then
          uv run --no-project --no-config python - <<'PY'
        import sys
        import tomllib
        from pathlib import Path

        try:
            links = tomllib.loads(Path("uv.toml").read_text()).get("find-links", [])
        except (OSError, UnicodeDecodeError, tomllib.TOMLDecodeError) as exc:
            sys.exit(f"local-deps: cannot read uv.toml: {exc}")
        if "external/wheelhouse" not in links:
            sys.exit('local-deps: uv.toml exists without find-links = ["external/wheelhouse"]; add that entry by hand.')
        PY
        fi
        mkdir -p external/wheelhouse
        # Build both archives aside first: a failed build keeps the previous wheelhouse intact.
        staging="$(mktemp -d external/wheelhouse.tmp.XXXXXX)"
        trap 'rm -rf -- "$staging"' EXIT
        for name in digital-metrics report-generator; do
          uv build --sdist "external/$name" -o "$staging"
        done
        # Only now drop stale archives of these two packages so only the current checkouts resolve.
        rm -f external/wheelhouse/digital_metrics-* external/wheelhouse/digital-metrics-* \
          external/wheelhouse/report_generator-* external/wheelhouse/report-generator-*
        mv "$staging"/*.tar.gz external/wheelhouse/
        if [ ! -e uv.toml ]; then
          printf 'find-links = ["external/wheelhouse"]\n' > uv.toml
          echo 'local-deps: created uv.toml with find-links = ["external/wheelhouse"]'
        fi

  fix:
    desc: Apply safe Ruff fixes and formatting before staging (never stages)
    cmds:
      - "{{.RUN}} {{.UV}} ruff check --fix --no-unsafe-fixes ."
      - "{{.RUN}} {{.UV}} ruff format ."

  check:
    desc: Lock, lint, boundary, type, dead-code and dependency checks (no source edits; syncs the worktree .venv to the lock)
    cmds:
      - task: _lock
      - task: _ruff
      - task: architecture
      - "{{.RUN}} {{.UV}} mypy ."
      - "{{.RUN}} {{.UV}} vulture"
      - "{{.RUN}} {{.UV}} deptry ."

  architecture:
    desc: Check product imports, effects, runtime targets and tooling boundaries
    dir: '{{.ROOT_DIR}}'
    cmds:
      - "{{.RUN}} {{.UV}} python -m scripts.architecture"

  _lock:
    internal: true
    cmds:
      - "{{.RUN}} uv lock --check"

  _ruff:
    internal: true
    cmds:
      - "{{.RUN}} {{.UV}} ruff check ."
      - "{{.RUN}} {{.UV}} ruff format --check ."

  test:
    desc: Run affected unit tests with worktree-local testmon history
    cmds:
      - task: _unit
        vars: {TESTMON_MODE: '--testmon'}

  test-full:
    desc: Run every unit test and refresh testmon dependency information
    cmds:
      - task: _unit
        vars: {TESTMON_MODE: '--testmon-noselect'}

  _unit:
    internal: true
    vars:
      TESTMON_ENV:
        sh: |
          {{.RUN}} {{.UV}} python - <<'PY'
          import hashlib
          import platform
          import subprocess
          import sys
          from pathlib import Path

          digest = hashlib.sha256()
          digest.update(repr((sys.version, sys.executable, platform.platform())).encode())
          listed = subprocess.check_output(
              ['git', 'ls-files', '--cached', '--others', '--exclude-standard', '-z']
          ).decode().split('\0')
          paths = {Path(name) for name in listed if name}
          # Ignored fixture assets and package data can also affect tests.
          paths.update(Path('tests/fixtures').rglob('*'))
          paths.update(Path('src/clearml_yolo').rglob('*'))
          configs = {
              'uv.lock', 'Taskfile.yml', '.pre-commit-config.yaml', '.python-version',
              '.importlinter', 'ruff.toml',
          }
          for path in sorted(paths):
              if not path.is_file() or '__pycache__' in path.parts or path.suffix in {'.pyc', '.pyo'}:
                  continue
              in_tree = path.parts[0] in {'src', 'tests', 'scripts'}
              config = path.name in configs or path.suffix in {'.toml', '.ini', '.cfg'}
              if not (in_tree or config):
                  continue
              digest.update(path.as_posix().encode() + b'\0')
              # Python execution dependencies stay with testmon. Scripts are
              # orchestration inputs, so changes conservatively invalidate.
              if path.suffix != '.py' or path.parts[0] == 'scripts':
                  digest.update(path.read_bytes())
              digest.update(b'\0')
          print(digest.hexdigest())
          PY
    cmds:
      - "{{.RUN}} {{.UV}} pytest {{.TESTMON_MODE}} --testmon-env={{.TESTMON_ENV}} --ignore=tests/integration -n {{.TEST_WORKERS}} --dist loadgroup"

  verify:
    desc: Development verification (static checks and affected unit tests; no build)
    cmds:
      - task: check
      - task: test

  properties:
    desc: Randomized unit property exploration
    cmds:
      - "HYPOTHESIS_PROFILE=explore {{.RUN}} {{.UV}} pytest --ignore=tests/integration -p no:randomly -n {{.TEST_WORKERS}} --dist loadgroup"

  infra-check:
    desc: Read-only bounded preflight of the test cluster (0 available, 3 unavailable, 1 error)
    cmds:
      - "{{.RUN}} {{.UV}} python -m tests.integration.lifecycle check"

  infra-up:
    desc: Create this worktree's test environment (COMPONENTS=all, clearml or fiftyone)
    vars:
      COMPONENTS: '{{default "all" .COMPONENTS}}'
      IDENTIFIER_ONLY: '{{default "0" .IDENTIFIER_ONLY}}'
    cmds:
      - "{{.RUN}} {{.UV}} python -m tests.integration.lifecycle up --components {{.COMPONENTS | shellQuote}} {{if eq .IDENTIFIER_ONLY \"1\"}}--identifier-only{{end}}"

  infra-env:
    desc: Export the recorded environment for eval; includes credentials, never print or log
    silent: true
    cmds:
      - "{{.RUN}} {{.UV}} python -m tests.integration.lifecycle env"

  infra-down:
    desc: Delete the recorded test environment, or ENV, and prove it absent
    cmds:
      - "{{.RUN}} {{.UV}} python -m tests.integration.lifecycle stop {{if .ENV}}--env {{.ENV | shellQuote}}{{end}}"

  integration:
    desc: Create a test environment, run the non-GPU live tests, and tear it down
    cmds:
      - |
        exec bash -eu <<'BASH'
        owned_environment="$({{.TASK_EXE | shellQuote}} --exit-code infra-up IDENTIFIER_ONLY=1)"
        cleanup() {
          result=$?
          trap - EXIT INT TERM
          if [ "${INTEGRATION_KEEP_DATA:-0}" = 1 ]; then
            echo "Test environment retained; run task infra-down ENV=$owned_environment within its 48-hour lifetime." >&2
          elif ! {{.TASK_EXE | shellQuote}} --exit-code infra-down "ENV=$owned_environment"; then
            echo "Test environment cleanup failed; retry task infra-down ENV=$owned_environment." >&2
            result=1
          fi
          exit "$result"
        }
        trap cleanup EXIT
        trap 'exit 130' INT
        trap 'exit 143' TERM
        exports="$({{.TASK_EXE | shellQuote}} --exit-code infra-env)"
        eval "$exports"
        if [ "$INTEGRATION_RUN_TAG" != "$owned_environment" ]; then
          echo 'The environment record changed during setup; refusing to adopt it.' >&2
          exit 1
        fi
        # Adopt the Task-owned environment; Task remains responsible for teardown.
        CY_TASK_VERIFICATION=1 {{.RUN}} {{.UV}} pytest tests/integration -m 'not ddp_gpu and not severstal_gpu' -n 0
        BASH

  _clean-tip:
    internal: true
    cmds:
      - |
        test -z "$(git status --porcelain --untracked-files=all)" || {
          echo 'Acceptance requires a clean committed tip.' >&2
          git status --short --untracked-files=all >&2
          exit 1
        }

  acceptance:
    desc: Clean tip, checks, properties, early live preflight, unit suite with coverage, live part, clean unchanged tip
    vars:
      # Recorded before any stage runs; the final command compares a fresh rev-parse.
      START_HEAD:
        sh: git rev-parse HEAD
      # 1 when every path changed since master is documentation; no commits since
      # master runs the live part.
      DOCS_ONLY:
        sh: |
          bash -eu -o pipefail -c '
            base=$(git merge-base master HEAD)
            changed=$(git diff --name-only "$base"..HEAD)
            if [ -z "$changed" ]; then echo 0; exit 0; fi
            while IFS= read -r path; do
              case "$path" in
                *.md|docs/*|specs/*) ;;
                *) echo 0; exit 0 ;;
              esac
            done <<< "$changed"
            echo 1
          '
    cmds:
      - task: _clean-tip
      - task: check
      - task: properties
      # Live preflight early, so an unavailable cluster defers before the long unit suite.
      - |
        if [ "{{.DOCS_ONLY}}" = 1 ]; then
          echo "NOTICE: every path changed since master is documentation (*.md, docs/, specs/);" >&2
          echo "NOTICE: the live part (infra-check, integration) is SKIPPED and not verified." >&2
          exit 0
        fi
        status=0
        "{{.TASK_EXE}}" --exit-code infra-check || status=$?
        if [ "$status" = 3 ]; then
          echo "DEFERRED: the cluster is unavailable (infra-check exit 3); acceptance is blocked until the live part runs." >&2
        fi
        exit "$status"
      - "mkdir -p {{.ROOT_DIR | shellQuote}}/.tmp/coverage"
      # Coverage and its floor apply to the unit suite only; the live part is not measured.
      - "{{.RUN}} {{.UV}} pytest --cov --ignore=tests/integration -n {{.TEST_WORKERS}} --dist loadgroup"
      - |
        if [ "{{.DOCS_ONLY}}" = 1 ]; then exit 0; fi
        status=0
        "{{.TASK_EXE}}" --exit-code integration || status=$?
        if [ "$status" = 3 ]; then
          echo "DEFERRED: the test environment became unavailable (exit 3); acceptance is blocked until the live part runs." >&2
        fi
        exit "$status"
      - task: _clean-tip
      - |
        if [ "$(git rev-parse HEAD)" != "{{.START_HEAD}}" ]; then
          echo "Acceptance requires an unchanged tip: HEAD moved from {{.START_HEAD}} to $(git rev-parse HEAD)." >&2
          exit 1
        fi
        echo "Accepted tip: {{.START_HEAD}}"
  # --- stream A end ---
  # --- stream B begin ---
  release-commit-check:
    desc: Release exception checks; runs only inside the semantic-release build_command
    cmds:
      - |
        bash -eu -c '
          if ! git diff --quiet --ignore-submodules=none; then
            echo "Release-commit check requires no unstaged tracked changes." >&2
            exit 1
          fi
          if IFS= read -r -d "" path < <(git ls-files --others --exclude-standard -z); then
            echo "Release-commit check requires no untracked files: $path" >&2
            exit 1
          fi
          while IFS= read -r -d "" path; do
            case "$path" in
              pyproject.toml|uv.lock|CHANGELOG.md) ;;
              *) echo "Outside release exception: $path" >&2; exit 1 ;;
            esac
          done < <(git diff --cached --name-only -z)
        '
      - "{{.RUN}} {{.UV}} python scripts/release_lock_guard.py"
      - task: _lock
      - task: _ruff
      - "{{.RUN}} {{.UV}} deptry ."

  paired-check:
    desc: Paired CY and cy-queue release check in a temporary environment (CY_QUEUE_DIR, default ../cy-queue)
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        set -eu
        root={{.ROOT_DIR | shellQuote}}
        queue="${CY_QUEUE_DIR:-$root/../cy-queue}"
        if [ ! -f "$queue/pyproject.toml" ]; then
          echo "paired-check: no cy-queue checkout at $queue; set CY_QUEUE_DIR." >&2
          exit 1
        fi
        queue="$(cd "$queue" && pwd -P)"
        # The worktree .venv stays untouched: the pair is installed into a temporary
        # environment on the same filesystem (ignored .tmp/), removed on exit.
        mkdir -p "$root/.tmp"
        scratch="$(mktemp -d "$root/.tmp/paired-check.XXXXXX")"
        trap 'rm -rf -- "$scratch"' EXIT
        venv="$scratch/venv"
        python="$venv/bin/python"
        UV_PROJECT_ENVIRONMENT="$venv" uv sync --locked --dev
        uv pip install --python "$python" -e "$queue"
        uv pip check --python "$python"
        # Both distributions must match their source versions and be the editable
        # installs of these checkouts (cy-queue's minimum-only CY bound must not have
        # replaced the locked CY with an index build).
        "$python" - "$root" "$queue" <<'PY'
        import importlib.metadata
        import json
        import sys
        import tomllib
        from pathlib import Path
        from urllib.parse import unquote, urlparse

        for directory in map(Path, sys.argv[1:]):
            project = tomllib.loads((directory / "pyproject.toml").read_text())["project"]
            distribution = importlib.metadata.distribution(project["name"])
            if distribution.version != project["version"]:
                sys.exit(f"paired-check: {project['name']} source {project['version']} != installed {distribution.version}")
            direct = json.loads(distribution.read_text("direct_url.json") or "{}")
            location = Path(unquote(urlparse(direct.get("url", "")).path))
            editable = direct.get("dir_info", {}).get("editable", False)
            if not editable or location.resolve() != directory.resolve():
                sys.exit(f"paired-check: {project['name']} is not the editable install of {directory}: {direct}")
        PY
        (cd "$queue" && "$python" -m pytest -q)
        "$venv/bin/cy-queue" --help >/dev/null
        for project in "$root" "$queue"; do
          "$python" - "$project" "$(git -C "$project" rev-parse HEAD)" <<'PY'
        import sys
        import tomllib
        from pathlib import Path

        project = tomllib.loads((Path(sys.argv[1]) / "pyproject.toml").read_text())["project"]
        print(f"paired-check: {project['name']} {project['version']} {sys.argv[2]} {sys.argv[1]}")
        PY
        done

  release-acceptance:
    desc: Release acceptance (acceptance, single-GPU severstal, multi-GPU DDP unless waived, FiftyOne, paired-check)
    # The real-run gate of the running-end-to-end-tests skill remains a separate step. A GPU
    # busy with the user's workload is deferred verification, checked by the agent or
    # operator before starting (verification-workflow skill); it is not automated here.
    cmds:
      - |
        if [ -z "${CY_SEVERSTAL_ARGS:-}" ]; then
          echo "release-acceptance: the single-GPU severstal suite is required; set CY_SEVERSTAL_ARGS to its pytest options (--run-severstal-gpu ...)." >&2
          exit 1
        fi
      - task: acceptance
      # The arguments are split into pytest options on purpose (unquoted).
      - "CY_TASK_VERIFICATION=1 {{.RUN}} {{.UV}} pytest tests/integration -m severstal_gpu -p no:randomly -n 0 $CY_SEVERSTAL_ARGS"
      # Multi-GPU DDP is waived on single-GPU hosts (FR-015): reported, never blocking.
      - |
        if [ -z "${CY_DDP_ARGS:-}" ]; then
          echo "multi-GPU DDP: waived (CY_DDP_ARGS unset)"
          exit 0
        fi
        CY_TASK_VERIFICATION=1 {{.RUN}} {{.UV}} pytest tests/integration -m ddp_gpu -p no:randomly -n 0 $CY_DDP_ARGS
      - |
        set -eu
        mkdir -p {{.ROOT_DIR | shellQuote}}/.tmp
        database="$(mktemp -d {{.ROOT_DIR | shellQuote}}/.tmp/fiftyone-db.XXXXXX)"
        trap 'rm -rf -- "$database"' EXIT
        # The database is the test environment's (database component only); the
        # directory holds the publisher's locks.
        CY_TEST_FIFTYONE=1 CY_TASK_VERIFICATION=1 FIFTYONE_DATABASE_DIR="$database" {{.RUN}} {{.UV}} pytest tests/integration/fiftyone -p no:randomly -n 0
      - task: paired-check
  # --- stream B end ---
  # --- stream C begin ---
  mutation:
    desc: Advisory mutation report for changed functions (exit 0 ok, 1 strict survivors, 2 tool error)
    cmds:
      - "{{.RUN}} {{.UV}} python scripts/mutation.py {{.CLI_ARGS}}"
  # --- stream C end ---

name = "ultralytics SDK has explicit owners"
type = "forbidden"
source_modules = ["clearml_yolo"]
forbidden_modules = ["ultralytics"]
allow_indirect_imports = true
ignore_imports = [
    "clearml_yolo.adapters.integrations.native_ddp -> ultralytics",

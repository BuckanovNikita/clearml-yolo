[project]
name = "clearml-yolo"
version = "0.13.2"
description = "Composable hydra-zen apps for YOLO training, inference, metrics and model comparison reports"
readme = "README.md"
authors = [
    { name = "Buckanov Nikita", email = "buckanov.nikita@yandex.ru" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4.165",
    # Native local NDJSON conversion uses this optional upstream dependency.
    "aiohttp>=3.9",
    # Native training uses this optional upstream augmentation block.
    "albumentations>=2.0,<3",
    "hydra-core>=1.3",
    "hydra-zen>=0.16",
    "omegaconf>=2.3,<2.4",
    "clearml>=1.13",
    "fiftyone>=1.22,<2",
    # FiftyOne's Strawberry integration still imports graphql.execution.ExecutionContext.
    "graphql-core>=3.2,<3.3",
    "filelock>=3.16",
    "pydantic>=2",
    "pyyaml>=6",
    "loguru>=0.7",
    "pandas>=2.0",
    "pillow>=10",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    # The external/ submodules track upstream main and pin resolved commits (see AGENTS.md).
    "digital-metrics>=0.5.3",
    "report-generator>=0.1.0",
    "ruamel-yaml>=0.18,<0.19",
]

[project.scripts]
cy = "clearml_yolo.apps.pipeline:main"
cy-train = "clearml_yolo.apps.train:main"
cy-predict = "clearml_yolo.apps.predict:main"
cy-metrics = "clearml_yolo.apps.metrics:main"
cy-report = "clearml_yolo.apps.report:main"
cy-compare = "clearml_yolo.apps.compare:main"
cy-ground-truth = "clearml_yolo.apps.ground_truth:main"
cy-val = "clearml_yolo.apps.val:main"
cy-init-config = "clearml_yolo.apps.config_tree:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=1.11",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "ruff>=0.6",
    "python-semantic-release>=10.5,<11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["external"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    # Torch, ultralytics and the ClearML SDK cost seconds to import, so the modules that
    # need them pull them in at call time and every CLI entrypoint stays responsive.
    "PLC0415",
    # Every task entrypoint is a hydra-zen config function: one parameter per CLI flag,
    # so an argument budget would only push the flags into a second indirection.
    "PLR0913",
    "PLR0917",
    # The message belongs at the raise site here; the exception types are stdlib ones
    # whose whole payload is that message.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, reach into privates, name literal expectations inline, feed known-value
# temp paths and unpickle their own fixtures, and pytest collects them without a package.
"tests/**" = ["ARG", "INP001", "PLR2004", "S101", "S108", "S301", "SLF001"]
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use loguru's logger, which is what every module and the ClearML handler expect."

[tool.ruff.lint.isort]
known-first-party = ["clearml_yolo"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.importlinter]
root_packages = ["clearml_yolo"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Package layers"
type = "layers"
layers = [
    "clearml_yolo.apps",
    "clearml_yolo.config_tree",
    "clearml_yolo.configs",
    "clearml_yolo.tasks",
    "clearml_yolo.publishing",
    "clearml_yolo.comparison",
    "clearml_yolo.dataset_cache",
    "clearml_yolo.dataset",
    "clearml_yolo.dataset_export",
    "clearml_yolo.dataset_records",
    "clearml_yolo.native_ddp",
    "clearml_yolo.inference | clearml_yolo.ground_truth | clearml_yolo.clearml_models | clearml_yolo.clearml_report | clearml_yolo.clearml_native | clearml_yolo.native_runtime",
    "clearml_yolo.native_config | clearml_yolo.clearml_session | clearml_yolo.progress | clearml_yolo.artifact_names",
    "clearml_yolo.run_identity",
    "clearml_yolo.filesystem",
]

[[tool.importlinter.contracts]]
name = "Task layers"
type = "layers"
containers = ["clearml_yolo.tasks"]
layers = ["pipeline", "val | report", "metrics", "compare | predict | train | ground_truth", "publication"]

[[tool.importlinter.contracts]]
name = "Comparison layers"
type = "layers"
containers = ["clearml_yolo.comparison"]
layers = ["assemble", "reinfer | workbook | scoring | significance", "evaluation_payload"]

[[tool.importlinter.contracts]]
name = "Every app entrypoint stands alone"
type = "independence"
modules = [
    "clearml_yolo.apps.compare",
    "clearml_yolo.apps.config_tree",
    "clearml_yolo.apps.ground_truth",
    "clearml_yolo.apps.metrics",
    "clearml_yolo.apps.pipeline",
    "clearml_yolo.apps.predict",
    "clearml_yolo.apps.report",
    "clearml_yolo.apps.train",
    "clearml_yolo.apps.val",
]

[[tool.importlinter.contracts]]
name = "The ClearML SDK stays behind the clearml_* adapters"
type = "forbidden"
source_modules = [
    "clearml_yolo.dataset_cache",
    "clearml_yolo.dataset",
    "clearml_yolo.dataset_export",
    "clearml_yolo.dataset_records",
    "clearml_yolo.apps",
    "clearml_yolo.config_tree",
    "clearml_yolo.comparison",
    "clearml_yolo.configs",
    "clearml_yolo.inference",
    "clearml_yolo.ground_truth",
    "clearml_yolo.progress",
    "clearml_yolo.artifact_names",
    "clearml_yolo.run_identity",
]
forbidden_modules = ["clearml"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The domain does not know it is configured by hydra"
type = "forbidden"
source_modules = [
    "clearml_yolo.dataset_cache",
    "clearml_yolo.dataset",
    "clearml_yolo.dataset_export",
    "clearml_yolo.dataset_records",
    "clearml_yolo.comparison",
    "clearml_yolo.inference",
    "clearml_yolo.ground_truth",
    "clearml_yolo.progress",
    "clearml_yolo.artifact_names",
    "clearml_yolo.clearml_session",
    "clearml_yolo.clearml_models",
    "clearml_yolo.clearml_report",
    "clearml_yolo.run_identity",
]
forbidden_modules = ["hydra", "hydra_zen", "omegaconf"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Model weights are only ever loaded in one place"
type = "forbidden"
source_modules = [
    "clearml_yolo.dataset_cache",
    "clearml_yolo.dataset",
    "clearml_yolo.dataset_export",
    "clearml_yolo.dataset_records",
    "clearml_yolo.apps",
    "clearml_yolo.config_tree",
    "clearml_yolo.configs",
    "clearml_yolo.clearml_session",
    "clearml_yolo.clearml_models",
    "clearml_yolo.clearml_report",
    "clearml_yolo.progress",
    "clearml_yolo.artifact_names",
    "clearml_yolo.tasks.pipeline",
    "clearml_yolo.tasks.metrics",
    "clearml_yolo.tasks.report",
    "clearml_yolo.run_identity",
]
forbidden_modules = ["ultralytics", "torch"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "FiftyOne stays behind its replaceable adapter"
type = "forbidden"
source_modules = ["clearml_yolo"]
forbidden_modules = ["fiftyone"]
allow_indirect_imports = true
ignore_imports = ["clearml_yolo.publishing.fiftyone_adapter -> fiftyone"]

[[tool.importlinter.contracts]]
name = "Publication has no tracking or execution side effects"
type = "forbidden"
source_modules = ["clearml_yolo.publishing"]
forbidden_modules = ["clearml", "clearml_yolo.clearml_session", "clearml_yolo.tasks", "hydra", "hydra_zen", "omegaconf", "ultralytics", "torch"]
allow_indirect_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
# Submodules are external dependencies, so they are not ours to type-check.
exclude = ["^external/", "^(outputs|runs|multirun|build|dist)/"]

[[tool.mypy.overrides]]
# The only dependencies that ship neither inline types nor a stub package. Everything
# else is checked against available signatures, except explicitly opaque adapter boundaries.
module = [
    "digital_metrics.*",
    "report_generator.*",
    "scipy.*",
    "tqdm.*",
    "fiftyone.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"
no_git_verify = false

[tool.semantic_release.branches.master]
match = "^master$"
prerelease = false

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.changelog]
mode = "init"
exclude_commit_patterns = ['^chore\(release\):']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

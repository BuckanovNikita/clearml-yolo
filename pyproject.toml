[tool.mypy]
python_version = "3.12"
strict = true
# Hydra plugins use a namespace package; keep source and test import roots unambiguous.
explicit_package_bases = true
mypy_path = ["src", "tests"]
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
# Local copies are external dependencies, so they are not ours to type-check.
exclude = ["^external/", "^(outputs|runs|multirun|build|dist)/"]

[[tool.mypy.overrides]]
# These dependencies have no installed typing coverage at the imported boundaries.
# Keep this list narrow; missing project imports must remain errors.
module = [
    "digital_metrics.*",
    "report_generator.*",
    "fiftyone.*",
]
ignore_missing_imports = true

[tool.vulture]
# Cross-file uses matter; never reduce this to pre-commit's staged filename list.
paths = ["src", "scripts", "tests"]
# Include unused arguments/unreachable code (100%) and imports (90%). Dynamic
# framework members (60%) remain an advisory audit; see docs/static-analysis.md.
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "ddp_cpu: real multi-rank CPU YOLO training and native relay integration",
    "ddp_gpu: opt-in real multi-GPU direct/queued native pipeline acceptance",
    "process_capabilities: Linux supervision preflight regression tests",
    "gpu_controls: host-wide GPU holds and manual reservation recovery",
]

[tool.coverage.run]
branch = true
source = ["clearml_yolo"]
data_file = ".tmp/coverage/.coverage"

[tool.coverage.report]
show_missing = true

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"
no_git_verify = false

[tool.semantic_release.branches.master]
match = "^master$"
prerelease = false

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.changelog]
mode = "init"
exclude_commit_patterns = ['^chore\(release\):']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false


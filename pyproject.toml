[[tool.importlinter.contracts]]
name = "Exhaustive root layer classification"
type = "layers"
containers = ["clearml_yolo"]
layers = ["entrypoints", "adapters", "application", "core"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Exhaustive adapter responsibility classification"
type = "layers"
containers = ["clearml_yolo.adapters"]
# Peers share a classification level; the peer contracts enforce their allowed edges.
layers = ["storage:observability:yolo:evaluation:reporting:clearml:fiftyone:runtime:integrations"]
exhaustive = true

[[tool.importlinter.contracts]]
name = "Exhaustive application classification"
type = "layers"
containers = ["clearml_yolo.application"]
layers = ["use_cases", "evaluation", "ports", "contracts"]
exhaustive = true

[tool.mypy]
python_version = "3.12"
strict = true
# Hydra plugins use a namespace package; keep source and test import roots unambiguous.
explicit_package_bases = true
mypy_path = ["src", "tests"]
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
# Local copies are external dependencies, so they are not ours to type-check.
exclude = ["^external/", "^(outputs|runs|multirun|build|dist)/"]

[[tool.mypy.overrides]]
# The only dependencies that ship neither inline types nor a stub package. Everything
# else is checked against available signatures, except explicitly opaque adapter boundaries.
module = [
    "digital_metrics.*",
    "report_generator.*",
    "scipy.*",
    "tqdm.*",
    "fiftyone.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = ["ddp_cpu: real multi-rank CPU YOLO training and native relay integration"]

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"
no_git_verify = false

[tool.semantic_release.branches.master]
match = "^master$"
prerelease = false

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.changelog]
mode = "init"
exclude_commit_patterns = ['^chore\(release\):']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

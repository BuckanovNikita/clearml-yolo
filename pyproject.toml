[project]
name = "clearml-yolo"
version = "0.2.0"
description = "Composable hydra-zen apps for YOLO training, inference, metrics and model comparison reports"
readme = "README.md"
authors = [
    { name = "Buckanov Nikita", email = "buckanov.nikita@yandex.ru" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.4",
    # Not used directly. Ultralytics declares it only as an extra, and without it its own
    # default augmentation block silently turns into a no-op.
    "albumentations>=2.0,<3",
    "hydra-core>=1.3",
    "hydra-zen>=0.16",
    "clearml>=1.13",
    "pydantic>=2",
    "loguru>=0.7",
    "pandas>=2.0",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "nvidia-ml-py",
    "tqdm>=4.66",
    # The cy-queue TUI draws with it. Ultralytics happens to pull it in today, which is not
    # a promise we can build on.
    "rich>=13",
    "digital-metrics",
    "report-generator",
]

[project.scripts]
cy = "clearml_yolo.apps.pipeline:main"
cy-train = "clearml_yolo.apps.train:main"
cy-predict = "clearml_yolo.apps.predict:main"
cy-metrics = "clearml_yolo.apps.metrics:main"
cy-report = "clearml_yolo.apps.report:main"
cy-compare = "clearml_yolo.apps.compare:main"
cy-ground-truth = "clearml_yolo.apps.ground_truth:main"
cy-init-config = "clearml_yolo.apps.config_tree:main"
cy-queue = "clearml_yolo.apps.queue:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
digital-metrics = { git = "https://github.com/Wasilkas/digital-metrics" }
report-generator = { git = "https://github.com/Wasilkas/report-generator" }

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=1.11",
    "pandas-stubs",
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
]
ignore = [
    # Torch, ultralytics and the ClearML SDK cost seconds to import, so the modules that
    # need them pull them in at call time and every CLI entrypoint stays responsive.
    "PLC0415",
    # Every task entrypoint is a hydra-zen config function: one parameter per CLI flag,
    # so an argument budget would only push the flags into a second indirection.
    "PLR0913",
    "PLR0917",
    # The message belongs at the raise site here; the exception types are stdlib ones
    # whose whole payload is that message.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, reach into privates, name literal expectations inline, feed known-value
# temp paths and unpickle their own fixtures, and pytest collects them without a package.
"tests/**" = ["ARG", "INP001", "PLR2004", "S101", "S108", "S301", "SLF001"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use loguru's logger, which is what every module and the ClearML handler expect."

[tool.ruff.lint.isort]
known-first-party = ["clearml_yolo"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.importlinter]
root_packages = ["clearml_yolo"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Package layers"
type = "layers"
layers = [
    "clearml_yolo.apps",
    "clearml_yolo.config_tree",
    "clearml_yolo.configs",
    "clearml_yolo.tasks",
    "clearml_yolo.comparison",
    "clearml_yolo.inference | clearml_yolo.ground_truth | clearml_yolo.clearml_models | clearml_yolo.clearml_report",
    "clearml_yolo.clearml_session | clearml_yolo.gpu | clearml_yolo.progress | clearml_yolo.artifact_names | clearml_yolo.ultralytics_params | clearml_yolo.queue_view",
    "clearml_yolo.run_queue | clearml_yolo.run_identity",
]

[[tool.importlinter.contracts]]
name = "Task layers"
type = "layers"
containers = ["clearml_yolo.tasks"]
layers = ["pipeline", "report", "metrics", "compare | predict | train"]

[[tool.importlinter.contracts]]
name = "Comparison layers"
type = "layers"
containers = ["clearml_yolo.comparison"]
layers = ["assemble", "reinfer | workbook | scoring | significance"]

[[tool.importlinter.contracts]]
name = "Every app entrypoint stands alone"
type = "independence"
modules = [
    "clearml_yolo.apps.compare",
    "clearml_yolo.apps.config_tree",
    "clearml_yolo.apps.ground_truth",
    "clearml_yolo.apps.metrics",
    "clearml_yolo.apps.pipeline",
    "clearml_yolo.apps.predict",
    "clearml_yolo.apps.queue",
    "clearml_yolo.apps.report",
    "clearml_yolo.apps.train",
]

[[tool.importlinter.contracts]]
name = "The ClearML SDK stays behind the clearml_* adapters"
type = "forbidden"
source_modules = [
    "clearml_yolo.apps",
    "clearml_yolo.comparison",
    "clearml_yolo.configs",
    "clearml_yolo.config_tree",
    "clearml_yolo.inference",
    "clearml_yolo.ground_truth",
    "clearml_yolo.gpu",
    "clearml_yolo.progress",
    "clearml_yolo.artifact_names",
    "clearml_yolo.ultralytics_params",
    "clearml_yolo.run_queue",
    "clearml_yolo.run_identity",
    "clearml_yolo.queue_view",
]
forbidden_modules = ["clearml"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "The domain does not know it is configured by hydra"
type = "forbidden"
source_modules = [
    "clearml_yolo.comparison",
    "clearml_yolo.inference",
    "clearml_yolo.ground_truth",
    "clearml_yolo.gpu",
    "clearml_yolo.progress",
    "clearml_yolo.artifact_names",
    "clearml_yolo.clearml_session",
    "clearml_yolo.clearml_models",
    "clearml_yolo.clearml_report",
    "clearml_yolo.ultralytics_params",
    "clearml_yolo.run_queue",
    "clearml_yolo.run_identity",
    "clearml_yolo.queue_view",
]
forbidden_modules = ["hydra", "hydra_zen", "omegaconf"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Model weights are only ever loaded in one place"
type = "forbidden"
source_modules = [
    "clearml_yolo.apps",
    "clearml_yolo.configs",
    "clearml_yolo.config_tree",
    "clearml_yolo.clearml_session",
    "clearml_yolo.clearml_models",
    "clearml_yolo.clearml_report",
    "clearml_yolo.progress",
    "clearml_yolo.artifact_names",
    "clearml_yolo.tasks.pipeline",
    "clearml_yolo.tasks.metrics",
    "clearml_yolo.tasks.report",
    # The rule that decides what reaches ultralytics must not itself need ultralytics:
    # importing it here would put torch on the critical path of every CLI start.
    "clearml_yolo.ultralytics_params",
    "clearml_yolo.run_queue",
    "clearml_yolo.run_identity",
    "clearml_yolo.queue_view",
]
forbidden_modules = ["ultralytics", "torch"]
allow_indirect_imports = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
# Both upstream repos are cloned into this tree for reference but consumed as installed
# packages, so they are not ours to type-check.
exclude = ["^(digital-metrics|report-generator)/"]

[[tool.mypy.overrides]]
# The only dependencies that ship neither inline types nor a stub package. Everything
# else, ultralytics and the ClearML SDK included, is checked against its real signatures.
module = [
    "digital_metrics.*",
    "report_generator.*",
    "pynvml.*",
    "scipy.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]

[project]
name = "clearml-yolo"
version = "0.30.1"
description = "Composable hydra-zen apps for native detector training, inference, metrics and comparison reports"
readme = "README.md"
authors = [
    { name = "Buckanov Nikita", email = "buckanov.nikita@yandex.ru" }
]
requires-python = ">=3.12.13,<3.14"
dependencies = [
    "ultralytics>=8.4.165",
    # Native local NDJSON conversion uses this optional upstream dependency.
    "aiohttp>=3.9",
    # Native training uses this optional upstream augmentation block.
    "albumentations>=2.0,<3",
    "hydra-core>=1.3",
    "hydra-zen>=0.16",
    "omegaconf>=2.3,<2.4",
    "clearml>=1.13",
    "fiftyone>=1.22,<2",
    # FiftyOne's Strawberry integration still imports graphql.execution.ExecutionContext.
    "graphql-core>=3.2,<3.3",
    "filelock>=3.32",
    "nvidia-ml-py>=12",
    "pydantic>=2",
    "pyyaml>=6",
    "loguru>=0.7",
    "pandas>=2.1.1",
    "numpy>=1.24.4",
    "pandera[pandas]>=0.34.1,<0.35",
    "pillow>=10",
    "scipy>=1.11",
    "openpyxl>=3.1",
    "tqdm>=4.66",
    # Local dependency copies live in external/; see docs/development.md.
    "digital-metrics>=0.6.1",
    "report-generator>=0.1.2",
    "ruamel-yaml>=0.18,<0.19",
]

[project.scripts]
cy = "clearml_yolo.entrypoints.pipeline:main"
cy-train = "clearml_yolo.entrypoints.train:main"
cy-predict = "clearml_yolo.entrypoints.predict:main"
cy-metrics = "clearml_yolo.entrypoints.metrics:main"
cy-report = "clearml_yolo.entrypoints.report:main"
cy-compare = "clearml_yolo.entrypoints.compare:main"
cy-ground-truth = "clearml_yolo.entrypoints.ground_truth:main"
cy-val = "clearml_yolo.entrypoints.val:main"
cy-export = "clearml_yolo.entrypoints.export:main"
cy-init-config = "clearml_yolo.entrypoints.config_tree:main"
cy-dedup = "clearml_yolo.entrypoints.dedup:main"
cy-queue = "clearml_yolo.entrypoints.queue:main"

[project.optional-dependencies]
queue-ui = ["textual>=0.89"]
detectors = [
    "calflops>=0.3.2",
    "faster-coco-eval==1.8.0",
    "pycocotools==2.0.11",
    "pytorch-lightning==2.6.6",
    "rfdetr[train]==1.11.2",
    "tensorboard>=2.20",
    "timm>=1.0.24,<2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]
export = [
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["clearml_yolo"]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "mypy>=1.11",
    "packaging>=26",
    "pandas-stubs",
    "types-PyYAML",
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "ruff>=0.16.1,<0.17",
    "scipy-stubs==1.18.0.1",
    "types-tqdm==4.70.0.20260906",
    "vulture>=2.16,<3",
    "python-semantic-release>=10.5,<11",
    "hypothesis>=6.169.1",
    "pytest-cov>=7.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["external"]

[tool.ruff.lint]
# Preview checks are opt-in by exact code; family selectors remain stable-only.
preview = true
explicit-preview-rules = true
# Rationale, omitted families and review boundaries: docs/static-analysis.md.
select = [
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "B",
    "BLE",
    "C4",
    "C90",
    "COM818",
    "D418",
    "D419",
    "DTZ",
    "E",
    "ERA",
    "EXE",
    "F",
    "FA",
    "FLY",
    "FURB",
    "G",
    "I",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "N",
    "NPY",
    "PD",
    "PERF",
    "PGH",
    "PIE",
    "PL",
    "PT",
    "PTH",
    "PYI",
    "Q",
    "RET",
    "RSE",
    "RUF",
    "S",
    "SIM",
    "SLF",
    "SLOT",
    "T10",
    "T20",
    "TC004",
    "TC005",
    "TC007",
    "TC010",
    "TID",
    "TRY",
    "UP",
    "W",
    "YTT",
    # Reviewed preview checks; see docs/static-analysis.md.
    "ASYNC119",
    "B901",
    "B909",
    "PT029",
    "PLE1141",
    "PLE4703",
    "RUF045",
    "RUF054",
    "RUF066",
    "RUF071",
    "RUF074",
    "RUF052",
    "PLW1514",
]
ignore = [
    # Opaque SDK interfaces and controlled test doubles require explicit Any boundaries.
    # Strict mypy checks project-owned contracts; Any is not a default for new interfaces.
    "ANN401",
    # Torch, ultralytics and the ClearML SDK cost seconds to import, so the modules that
    # need them pull them in at call time and every CLI entrypoint stays responsive.
    "PLC0415",
    # Public Hydra targets and scientific/SDK contracts expose independent named inputs.
    # Retain their signatures; internal helpers still merit individual design review.
    "PLR0913",
    "PLR0917",
    # Keep validation context at the raise site for stdlib and domain marker exceptions;
    # message-specific subclasses would separate the condition from its explanation.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, reach into privates, name literal expectations inline, feed known-value
# temp paths, and pytest collects them without a package.
"tests/**" = ["ARG", "INP001", "PLR2004", "S101", "S108", "SLF001"]
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"logging".msg = "Use loguru's logger, which is what every module and the ClearML handler expect."

[tool.ruff.lint.isort]
known-first-party = ["clearml_yolo"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.importlinter]
root_packages = ["clearml_yolo"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean architecture inward layers"
type = "layers"
layers = [
    "clearml_yolo.entrypoints",
    "clearml_yolo.adapters",
    "clearml_yolo.application",
    "clearml_yolo.core",
]

[[tool.importlinter.contracts]]
name = "Adapters depend only on application ports and contracts"
type = "forbidden"
source_modules = ["clearml_yolo.adapters"]
forbidden_modules = ["clearml_yolo.application.use_cases", "clearml_yolo.application.evaluation"]

[[tool.importlinter.contracts]]
name = "Application command composition is inward and acyclic"
type = "layers"
containers = ["clearml_yolo.application.use_cases"]
layers = ["pipeline", "val | report", "metrics", "compare | predict | train | ground_truth | export", "publication"]

[[tool.importlinter.contracts]]
name = "Every command entrypoint stands alone"
type = "independence"
modules = [
    "clearml_yolo.entrypoints.compare",
    "clearml_yolo.entrypoints.config_tree",
    "clearml_yolo.entrypoints.dedup",
    "clearml_yolo.entrypoints.export",
    "clearml_yolo.entrypoints.ground_truth",
    "clearml_yolo.entrypoints.metrics",
    "clearml_yolo.entrypoints.pipeline",
    "clearml_yolo.entrypoints.predict",
    "clearml_yolo.entrypoints.queue",
    "clearml_yolo.entrypoints.report",
    "clearml_yolo.entrypoints.train",
    "clearml_yolo.entrypoints.val",
]


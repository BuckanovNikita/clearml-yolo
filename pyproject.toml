[project]
name = "clearml-yolo"
version = "0.40.0"
description = "Composable hydra-zen apps for native detector training, inference, metrics and comparison reports"
readme = "README.md"
authors = [
    { name = "Buckanov Nikita", email = "buckanov.nikita@yandex.ru" }
]
requires-python = ">=3.12.13,<3.14"
dependencies = [
    "ultralytics>=8.4.184",
    # Native distributed workers must not install their serializer at execution time.
    "cloudpickle>=3.1.1",
    # Native local NDJSON conversion uses this optional upstream dependency.
    "aiohttp>=3.10.5",
    # Native training uses this optional upstream augmentation block.
    "albumentations>=2.0.8,<3",
    "hydra-core>=1.3.0",
    "hydra-zen>=0.16.0",
    "omegaconf>=2.3.0,<2.4",
    "clearml>=2.1.6",
    "fiftyone>=1.22.0,<2",
    # FiftyOne's Strawberry integration still imports graphql.execution.ExecutionContext.
    "graphql-core>=3.2.0,<3.3",
    "filelock>=3.32.0",
    "requests>=2.32.0",
    "pydantic>=2.10.0",
    "pyyaml>=6.0.2",
    "loguru>=0.7.0",
    "pandas>=3.0.0",
    "numpy>=2.1.0",
    "safetensors>=0.8.0,<0.9",
    "pandera[pandas]>=0.34.1,<0.35",
    "pillow>=12.2.0",
    "scipy>=1.14.1",
    "openpyxl>=3.1.5",
    "tqdm>=4.66.0",
    # Local dependency copies live in external/; see docs/development.md.
    "digital-metrics>=0.6.1",
    "report-generator>=0.1.2",
    "ruamel-yaml>=0.18.0,<0.19",
    # Every supported runtime capability is part of the standard installation.
    "calflops>=0.3.2",
    "faster-coco-eval==1.8.0",
    "pycocotools==2.0.11",
    "pytorch-lightning==2.6.6",
    "rfdetr[train]==1.11.2",
    "tensorboard>=2.20.0",
    "timm>=1.0.24,<2",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
]

[project.scripts]
cy = "clearml_yolo.entrypoints.pipeline:main"
cy-train = "clearml_yolo.entrypoints.train:main"
cy-predict = "clearml_yolo.entrypoints.predict:main"
cy-metrics = "clearml_yolo.entrypoints.metrics:main"
cy-report = "clearml_yolo.entrypoints.report:main"
cy-compare = "clearml_yolo.entrypoints.compare:main"
cy-ground-truth = "clearml_yolo.entrypoints.ground_truth:main"
cy-val = "clearml_yolo.entrypoints.val:main"
cy-export = "clearml_yolo.entrypoints.export:main"
cy-init-config = "clearml_yolo.entrypoints.config_tree:main"
cy-dedup = "clearml_yolo.entrypoints.dedup:main"
cy-batch-estimate = "clearml_yolo.entrypoints.batch_estimate:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["clearml_yolo"]

[dependency-groups]
dev = [
    "import-linter>=2.13",
    "markdown-it-py==4.2.0",
    "mypy>=1.11",
    "packaging>=26",
    "pandas-stubs",
    "types-PyYAML",
    "types-requests>=2.32.0",
    "pre-commit>=4.6.1",
    "pytest>=8.0",
    "ruff>=0.16.1,<0.17",
    "scipy-stubs==1.18.0.1",
    "types-tqdm==4.70.0.20260906",
    "vulture>=2.16,<3",
    "python-semantic-release>=10.5,<11",
    "hypothesis>=6.169.1",
    "pytest-cov>=7.1.0",
    "mutmut>=3.8,<3.9",
]

[tool.mypy]
python_version = "3.12"
strict = true
# Hydra plugins use a namespace package; keep source and test import roots unambiguous.
explicit_package_bases = true
mypy_path = ["src", "tests"]
warn_unreachable = true
disallow_any_unimported = true
enable_error_code = [
    "deprecated",
    "exhaustive-match",
    "explicit-override",
    "ignore-without-code",
    "mutable-override",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unimported-reveal",
    "unused-awaitable",
]
# Local copies are external dependencies, so they are not ours to type-check.
exclude = ["^external/", "^(outputs|runs|multirun|build|dist|mutants)/"]

[[tool.mypy.overrides]]
# These dependencies have no installed typing coverage at the imported boundaries.
# Keep this list narrow; missing project imports must remain errors.
module = [
    "albumentations.*",
    "digital_metrics.*",
    "report_generator.*",
    "fiftyone.*",
]
ignore_missing_imports = true

[tool.vulture]
# Cross-file uses matter; never reduce this to pre-commit's staged filename list.
paths = ["src", "scripts", "tests"]
# Include unused arguments/unreachable code (100%) and imports (90%). Dynamic
# framework members (60%) remain an advisory audit; see docs/static-analysis.md.
min_confidence = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "severstal_gpu: opt-in native all-model Severstal training and ClearML acceptance",
    "ddp_cpu: real multi-rank CPU YOLO training and native relay integration",
    "ddp_gpu: opt-in real multi-GPU direct/queued native pipeline acceptance",
    "process_capabilities: Linux supervision preflight regression tests",
    "gpu_controls: host-wide GPU holds and manual reservation recovery",
]

[tool.coverage.run]
branch = true
source = ["clearml_yolo"]
data_file = ".tmp/coverage/.coverage"

[tool.coverage.report]
show_missing = true

[tool.mutmut]
source_paths = ["src/"]
only_mutate = [
    "src/clearml_yolo/core/datasets.py",
    "src/clearml_yolo/core/evaluation/policy.py",
    "src/clearml_yolo/core/export_quality.py",
]
# The source tree supplies imports; only the three pure-policy files above mutate.
# tests/ includes the conftest helpers and fixtures used by these offline selections.
also_copy = ["tests/", "pyproject.toml"]
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = [
    "tests/test_dataset_records.py",
    "tests/test_input_correctness.py",
    "tests/test_comparison_scoring.py",
    "tests/test_export_quality.py",
    "tests/test_policy_mutation.py",
]

[tool.semantic_release]
commit_parser = "conventional"
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
commit_message = "chore(release): {version}"
no_git_verify = false

[tool.semantic_release.branches.master]
match = "^master$"
prerelease = false

[tool.semantic_release.remote]
ignore_token_for_push = true

[tool.semantic_release.changelog]
mode = "init"
exclude_commit_patterns = ['^chore\(release\):']

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"
mask_initial_release = false

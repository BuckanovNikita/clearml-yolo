# Generated by `cy-init-config`. Edit freely, then run:
#     uv run cy-metrics --config-dir conf --config-name cy-metrics

predictions: runs/latest/predictions.csv
ground_truth: ground_truth.csv
output_dir: runs/latest/metrics
splits:
- train
- val
- test
calibration_split: val
evaluation:
  _target_: clearml_yolo.tasks.metrics.EvaluationConfig
  iou_threshold: 0.5
  matching_strategy: iou_prior
  ap_method: interp
  confidence_optimization: per_class
  skip_cohen_kappa: true
  preprocess: false
  preprocess_preds_conf_threshold: null
  preprocess_preds_nms_containment_threshold: null
  preprocess_preds_nms_iou_threshold: null
  backend: null
clearml:
  _target_: clearml_yolo.clearml_session.ClearMLConfig
  enabled: true
  project_name: clearml-yolo
  task_name: yolo-run
  task_type: training
  tags: []
  output_uri: true
  continue_task_id: null
  reuse_last_task_id: false

# Relevant staged paths select checks; full acceptance runs after the final commit.
# Whole-project hooks include deleted paths in selection without passing them as arguments.
minimum_prek_version: "0.5.10"
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: untracked-sources
        name: No untracked files under src, tests or scripts
        entry: >-
          sh -c 'files=$(git ls-files --others --exclude-standard -- src tests scripts);
          test -z "$files" || { printf "Stage or remove:\n%s\n" "$files"; exit 1; }'
        language: system
        files: '^((src|tests|scripts)/|\.pre-commit-config\.yaml$)'
        include_deleted: true
        pass_filenames: false

      - id: ruff
        name: Ruff (changed Python files)
        entry: uv run --frozen --no-sync ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        exclude: '^(external|outputs|runs|multirun|build|dist|mutants|\.agents|\.claude)/'
        pass_filenames: true
        require_serial: true

      - id: ruff-config
        name: Ruff (configuration changes)
        entry: uv run --frozen --no-sync ruff check .
        language: system
        files: '^(pyproject\.toml|ruff\.toml|\.ruff\.toml|uv\.lock|\.pre-commit-config\.yaml)$'
        include_deleted: true
        pass_filenames: false
        require_serial: true

      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen --no-sync mypy .
        language: system
        files: '(^.*\.pyi?$|^(pyproject\.toml|mypy\.ini|\.mypy\.ini|uv\.lock|\.pre-commit-config\.yaml)$)'
        exclude: '^(external|outputs|runs|multirun|build|dist|mutants|\.agents|\.claude)/'
        include_deleted: true
        pass_filenames: false
        require_serial: true

      - id: vulture
        name: Vulture
        entry: uv run --frozen --no-sync vulture
        language: system
        files: '^((src|tests|scripts)/.*\.py$|pyproject\.toml$|uv\.lock$|\.pre-commit-config\.yaml$)'
        include_deleted: true
        pass_filenames: false
        require_serial: true

      - id: import-linter
        name: Import contracts
        entry: uv run --frozen --no-sync lint-imports
        language: system
        files: '^(src/.*\.py$|pyproject\.toml$|uv\.lock$|\.importlinter$|\.pre-commit-config\.yaml$)'
        include_deleted: true
        pass_filenames: false
        require_serial: true

      - id: pytest-full
        name: Full pytest for non-Python inputs
        entry: env -u PYTEST_ADDOPTS uv run --frozen --no-sync pytest --testmon-noselect -q
        language: system
        files: ^((src|tests|scripts)/|pytest\.ini$|setup\.cfg$|tox\.ini$|pyproject\.toml$|uv\.lock$|ruff\.toml$|\.importlinter$|\.pre-commit-config\.yaml$)
        exclude_types: [python]
        include_deleted: true
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: Affected pytest (testmon)
        entry: env -u PYTEST_ADDOPTS uv run --frozen --no-sync pytest --testmon -q
        language: system
        files: '^((src|tests|scripts)/.*\.py$|pyproject\.toml$|uv\.lock$|\.pre-commit-config\.yaml$)'
        include_deleted: true
        pass_filenames: false
        require_serial: true

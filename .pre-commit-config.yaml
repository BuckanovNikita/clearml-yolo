# Every check runs the project's own tools through `uv run`, so a hook and the command
# you type by hand are the same command against the same locked versions. Nothing here
# pins a second copy of ruff or mypy that could drift from the `dev` dependency group.
# Install both hooks with scripts/local_release.py --install-hooks. The custom
# post-commit launcher uses --all-files so pre-commit cannot hide dirty files.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: changelog
        name: Generate changelog from committed history
        entry: uv run --locked --no-sync python scripts/local_release.py --changelog
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: verify
        name: Verify the exact source and dependency view
        entry: uv run --frozen --no-sync python scripts/verify.py --hook
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: local-release
        name: Create local semantic version commit and tag
        entry: uv run --locked --no-sync python scripts/local_release.py
        args: [--post-commit]
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        require_serial: true

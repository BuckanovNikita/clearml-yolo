# prek (https://prek.j178.dev) runs these hooks; the format stays pre-commit compatible.
# Every check runs the project's own tools through `uv run`, so a hook and the command
# you type by hand are the same command against the same locked versions. Nothing here
# pins a second copy of ruff or mypy that could drift from the `dev` dependency group.
# Install both hooks with scripts/local_release.py --install-hooks. The custom
# post-commit launcher uses --all-files so the runner cannot hide dirty files.
#
# Hooks run serially in this order. Whole-repository checks always run, because staged
# file lists omit deletions; their own caches keep unchanged runs cheap. They analyze
# the complete tree (pass_filenames: false), which includes untracked files, so the
# untracked-sources hook rejects untracked files under src, tests and scripts.
# pytest-testmon reruns only tests affected by changed Python; pytest-full reruns the
# complete suite for non-Python inputs and refreshes the testmon database first, so the
# incremental hook then selects nothing. Generated release commits skip the heavy hook
# ids (scripts/local_release.py HEAVY_HOOKS); keep those names in sync.
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: changelog
        name: Generate changelog from committed history
        entry: uv run --locked --no-sync python scripts/local_release.py --changelog
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true
        # A regenerated changelog rejects the commit anyway; stop before analysis and
        # tests run, so only the retry (with the changelog staged) pays for them.
        fail_fast: true

      - id: untracked-sources
        name: No untracked files under src, tests or scripts
        entry: >-
          sh -c 'files=$(git ls-files --others --exclude-standard -- src tests scripts);
          test -z "$files" || { printf "Stage or remove:\n%s\n" "$files"; exit 1; }'
        language: system
        always_run: true
        pass_filenames: false

      - id: ruff
        name: Ruff
        entry: uv run --frozen --no-sync ruff check .
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: mypy
        name: mypy (strict)
        entry: uv run --frozen --no-sync mypy .
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: vulture
        name: Vulture
        entry: uv run --frozen --no-sync vulture
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: import-linter
        name: Import contracts
        entry: uv run --frozen --no-sync lint-imports
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: pytest-full
        name: Full pytest for non-Python inputs
        entry: env -u PYTEST_ADDOPTS uv run --frozen --no-sync pytest --testmon-noselect -q
        language: system
        files: ^((src|tests|scripts)/|pyproject\.toml$|uv\.lock$|ruff\.toml$|\.importlinter$|\.pre-commit-config\.yaml$)
        exclude_types: [python]
        pass_filenames: false
        require_serial: true

      - id: pytest
        name: Affected pytest (testmon)
        entry: env -u PYTEST_ADDOPTS uv run --frozen --no-sync pytest --testmon -q
        language: system
        always_run: true
        pass_filenames: false
        require_serial: true


      - id: local-release
        name: Create local semantic version commit and tag
        entry: uv run --locked --no-sync python scripts/local_release.py
        args: [--post-commit]
        language: system
        stages: [post-commit]
        always_run: true
        pass_filenames: false
        require_serial: true

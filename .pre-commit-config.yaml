# Task owns every verification command; prek only selects stages. Install the
# worktree-aware dispatchers with scripts/install-hooks.sh. Cheap hygiene hooks run
# before the serial Task development verification.
minimum_prek_version: "0.5.10"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: untracked-sources
        name: No untracked files under src, tests or scripts
        entry: >-
          sh -c 'files=$(git ls-files --others --exclude-standard -- src tests scripts);
          test -z "$files" || { printf "Stage or remove:\n%s\n" "$files"; exit 1; }'
        language: system
        files: '^((src|tests|scripts)/|\.pre-commit-config\.yaml$)'
        include_deleted: true
        pass_filenames: false

      - id: verify
        name: Task development verification
        entry: uv run --locked task --exit-code verify
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: integration-tests
        name: Task live integration
        entry: uv run --locked task --exit-code integration
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: acceptance-tests
        name: Task clean-tip acceptance
        entry: uv run --locked task --exit-code acceptance
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: property-exploration
        name: Task property exploration
        entry: uv run --locked task --exit-code properties
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]

      - id: mutmut
        name: Task changed-function mutation (advisory)
        entry: uv run --locked task --exit-code mutation
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        verbose: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, docs, feat, fix, perf, refactor, style, test]

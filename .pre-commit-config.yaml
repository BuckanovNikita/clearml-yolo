# Task owns hygiene, routing and verification; prek dispatches serially.
# scripts/git-hook.sh runs Task staging-check before prek can stash.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: local
    hooks:
      - id: verify
        name: Task change-aware verification
        entry: uv run --locked task --exit-code verify
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true

      - id: integration-tests
        name: Task live integration
        entry: uv run --locked task --exit-code integration
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        require_serial: true

      - id: acceptance-tests
        name: Task clean-tip acceptance
        entry: uv run --locked task --exit-code acceptance
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        require_serial: true

      - id: mutmut
        name: Task changed-function mutation (advisory)
        entry: uv run --locked task --exit-code mutation
        language: system
        pass_filenames: false
        always_run: true
        stages: [manual]
        require_serial: true
        verbose: true

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [build, chore, ci, docs, feat, fix, perf, refactor, style, test]
